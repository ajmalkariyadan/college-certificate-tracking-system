# Server Configuration
server.port=8080

# ==============================================================================
# DATABASE CONFIGURATION
# ==============================================================================

# Option 1: MySQL (Default)
spring.datasource.url=jdbc:mysql://localhost:3306/college_certificates_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Option 2: H2 In-Memory Database (Uncomment below and comment out MySQL if MySQL is not running)
# spring.datasource.url=jdbc:h2:mem:college_certificates_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true

# JPA / Hibernate Configuration
# 'update' automatically updates or creates tables according to JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Enable open-in-view for easy lazy-loading in DTO mappings
spring.jpa.open-in-view=true

# Jackson JSON Formatter
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
